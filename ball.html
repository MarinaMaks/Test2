<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Арканоид: Вертикальный</title>
    
    <!-- Правильный viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        .game-wrapper {
            width: 100%;
            height: 100dvh;
            position: relative;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000;
            border: 4px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 3 / 5; /* Строго вертикальное поле */
        }

        #uiContainer {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 15px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
            flex-direction: column;
            align-items: center;
        }
        #scoreBoard, #highScoreBoard {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            min-width: 140px;
        }

        #gameOverOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 30px 20px 120px;
            box-sizing: border-box;
        }
        #finalScoreText {
            font-size: 28px;
            color: #ccc;
            margin-bottom: 10px;
        }
        #leaderboardBox {
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            width: 90%;
            max-height: 50vh;
            overflow-y: auto;
        }
        #leaderboardTitle {
            font-size: 26px;
            margin-bottom: 15px;
            color: #FFD700;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 22px;
            border-bottom: 1px dashed #444;
        }
        .lb-rank { font-weight: bold; color: #aaa; min-width: 40px; }
        .lb-score { font-weight: bold; }

        #restartBtn {
            padding: 18px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
