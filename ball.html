<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Арканоид: Вертикальный Фикс</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-wrapper {
            width: 100%;
            height: 100dvh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        }

        canvas {
            background-color: #000;
            border: 4px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 9 / 16; 
        }

        #uiContainer {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 15px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
            flex-direction: column;
            align-items: center;
        }
        #scoreBoard, #highScoreBoard {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            min-width: 130px;
        }

        #gameOverOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 30px 20px 120px;
            box-sizing: border-box;
        }
        #finalScoreText { font-size: 26px; color: #ccc; }
        #leaderboardBox {
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            width: 90%;
            max-height: 50vh;
            overflow-y: auto;
        }
        #leaderboardTitle { font-size: 24px; margin-bottom: 15px; color: #FFD700; }
        .lb-item { display: flex; justify-content: space-between; padding: 10px 0; font-size: 20px; }
        .lb-rank { font-weight: bold; color: #aaa; min-width: 40px; }
        .lb-score { font-weight: bold; }

        #restartBtn {
            padding: 16px 40px;
            font-size: 22px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
            transform: scale(1);
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0) + 20px);
        }
        #restartBtn:hover:not(:disabled) { transform: scale(1.05); }

        #touchHint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0) + 90px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            color: #FFD700;
            border: 1px solid #FFD700;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>
</div>

<div id="uiContainer">
    <div id="scoreBoard">Счет: 0</div>
    <div id="highScoreBoard">Рекорд: --</div>
</div>

<div id="touchHint">Водите пальцем →</div>

<div id="gameOverOverlay">
    <h1 style="font-size: 52px; margin: 0;">Конец</h1>
    <div id="finalScoreText"></div>
    <div id="leaderboardBox"><div id="leaderboardTitle">ТОП РЕЗУЛЬТАТЫ</div><div id="leaderboardList"></div></div>
    <button id="restartBtn">Заново</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let score = 0, isGameOver = false, animationFrameId = null;
let paddle = {}, ball = {}, targets = [];
let targetRadius = 0;

/* --- Ровно 6 рядов --- */
const rowsCount = 6; 
let colsCount = 0;

// --- Масштабирование ---
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    
    // Берем реальную видимую область без плавающих панелей
    let visualHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    let visualWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;

    const BASE_WIDTH = 320;
    const BASE_HEIGHT = 568;

    let targetHeight = Math.round(visualHeight);
    let targetWidth = Math.round(BASE_WIDTH * (targetHeight / BASE_HEIGHT));

    if (targetWidth > visualWidth) {
        targetWidth = visualWidth;
        targetHeight = Math.round(targetWidth * (BASE_HEIGHT / BASE_WIDTH));
    }

    canvas.width = Math.round(targetWidth * dpr);
    canvas.height = Math.round(targetHeight * dpr);
    
    canvas.style.width = targetWidth + 'px';
    canvas.style.height = targetHeight + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createObjects(); 
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Создание объектов ---
function createObjects() {
    targets = []; 
    
    const cw = canvas.width;
    const ch = canvas.height;

    /* Получаем реальные пиксели нижней границы видимого окна */
    const viewport = window.visualViewport;
    const visibleBottomY = viewport ? viewport.offsetTop + viewport.height : window.innerHeight;
    
    /* Считаем отступ от низа относительно РЕАЛЬНОГО окна, а не высоты холста */
    const offsetFromScreenBottom = 80; 
    const rocketLogicalOffset = Math.round((offsetFromScreenBottom / window.innerHeight) * ch);

    paddle = {
        x: cw / 2 - (cw * 0.25) / 2,
        y: ch - rocketLogicalOffset, /* Теперь она всегда над низом экрана */
        width: cw * 0.25,
        height: 20,
        speed: 8,
        targetX: cw / 2 - (cw * 0.25) / 2
    };

    ball = {
        x: cw / 2,
        y: paddle.y - 30, /* Шарик чуть выше ракетки */
        radius: 10,
        dx: 0,
        dy: 0,
        speed: 5
    };

    targetRadius = 16; 
    
    const horizontalSpacePerBall = targetRadius * 2 + 25;
    colsCount = Math.floor(cw / horizontalSpacePerBall);
    const totalGridWidth = colsCount * horizontalSpacePerBall - 25;
    const startX = (cw - totalGridWidth) / 2 + targetRadius;
    const startY = 80;
    const verticalStep = targetRadius * 2 + 25;

    for (let r = 0; r < rowsCount; r++) {
        for (let c = 0; c < colsCount; c++) {
            const x = startX + c * horizontalSpacePerBall;
            const y = startY + r * verticalStep;
            const hue = 55 - r * 9; 
            targets.push({ x, y, radius: targetRadius, status: 1, color: `hsl(${hue}, 90%, 55%)` });
        }
    }
}

// --- Рекорды ---
function loadHighScores() { return JSON.parse(localStorage.getItem('arkanoidFinalClean') || '[0,0,0,0,0]'); }
function saveHighScores(scores) { localStorage.setItem('arkanoidFinalClean', JSON.stringify(scores)); }
function updateHighScoreUI() { const scores = loadHighScores(); highScoreBoard.innerHTML = `Рекорд: ${scores[0] || '--'}`; }
function checkNewHighScore(currentScore) { let scores = loadHighScores(); if (currentScore > scores[scores.length - 1]) { scores.push(currentScore); scores.sort((a,b)=>b-a); scores.splice(5); saveHighScores(scores); updateHighScoreUI(); } }
function renderLeaderboard() { const scores = loadHighScores(); leaderboardList.innerHTML = ''; scores.forEach((s,i)=>{ if(s===0&&i>0)return; const item=document.createElement('div'); item.className='lb-item'; let rank=''; switch(i+1){case 1:rank='🥇';break;case 2:rank='🥈';break;case 3:rank='🥉';break;default:rank=`${i+1}.`;} item.innerHTML=`<span class="lb-rank">${rank}</span><span class="lb-score">${s} оч.</span>`; leaderboardList.appendChild(item); }); }

// --- Отрисовка ---
function drawPaddle() { ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 10); ctx.fillStyle='#FFF'; ctx.fill(); ctx.closePath(); ctx.beginPath(); ctx.roundRect(paddle.targetX, paddle.y, paddle.width, paddle.height, 10); ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.fill(); ctx.closePath(); }
function drawBall() { ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle='#FFF'; ctx.fill(); ctx.closePath(); }
function drawTargets() { targets.forEach(t=>{ if(t.status===1){ ctx.beginPath(); ctx.arc(t.x,t.y,t.radius,0,Math.PI*2); ctx.fillStyle=t.color; ctx.shadowColor=t.color; ctx.shadowBlur=15; ctx.fill(); ctx.closePath(); ctx.shadowBlur=0; }}); }

// --- Игровая логика ---
function movePaddleTo(x) { if(isGameOver) return; paddle.targetX = Math.max(0, Math.min(x - paddle.width/2, canvas.width - paddle.width)); }
function updatePaddlePosition() { const diff = paddle.targetX - paddle.x; paddle.x += diff * 0.2; }
function circleCollision(cX,cY,cR,tX,tY,tR) { return (cX-tX)**2 + (cY-tY)**2 < (cR+tR)**2; }
function resolveWallCollisions() { if(ball.x+ball.dx>canvas.width-ball.radius||ball.x+ball.dx<ball.radius) ball.dx=-ball.dx; if(ball.y+ball.dy<ball.radius) ball.dy=-ball.dy; }

function collisionDetection() {
    resolveWallCollisions();
    
    if(ball.y+ball.dy>canvas.height-ball.radius-paddle.height){
        if(ball.x>paddle.x&&ball.x<paddle.x+paddle.width){
            let hitPos=(ball.x-(paddle.x+paddle.width/2))/(paddle.width/2);
            ball.dx=hitPos*7;
            ball.dy=-Math.abs(ball.dy)*1.05;
            if(Math.abs(ball.dx)>9) ball.dx=ball.dx>0?9:-9;
        }
    }
    
    if(ball.y-ball.radius>canvas.height){ endGame(); return; }
    
    targets.forEach(target=>{
        if(target.status===1&&circleCollision(ball.x,ball.y,ball.radius,target.x,target.y,target.radius)){
            target.status=0;
            const absDX=Math.abs(ball.x-target.x),absDY=Math.abs(ball.y-target.y);
            if(absDX>absDY)ball.dx=-ball.dx; else ball.dy=-ball.dy;
            score+=10;
            scoreBoard.innerHTML='Счет: '+score;
        }
    });
    
    if(targets.every(t=>t.status===0)){ alert('ПОБЕДА!'); resetGame(); }
}
function endGame() { cancelAnimationFrame(animationFrameId); isGameOver=true; checkNewHighScore(score); finalScoreText.innerHTML=`Вы набрали: ${score} очков`; renderLeaderboard(); gameOverOverlay.style.display='flex'; touchHint.style.display='none'; }
function resetGame() { score=0; isGameOver=false; scoreBoard.innerHTML='Счет: 0'; ball.x=canvas.width/2; ball.y=paddle.y - 30; ball.dx=0; ball.dy=0; paddle.x=canvas.width/2-paddle.width/2; paddle.targetX=paddle.x; createObjects(); gameOverOverlay.style.display='none'; touchHint.style.display='block'; }
function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); updatePaddlePosition(); drawTargets(); drawBall(); drawPaddle(); if(!isGameOver){ collisionDetection(); if(ball.dx!==0||ball.dy!==0){ ball.x+=ball.dx; ball.y+=ball.dy; } animationFrameId=requestAnimationFrame(loop); } }

// --- Управление ---
let lastTouchX = 0;
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); const rect=canvas.getBoundingClientRect(); const touch=e.touches[0]; lastTouchX=touch.clientX-rect.left; if(!isGameOver&&ball.dx===0&&ball.dy===0){ ball.dx=4*(Math.random()>0.5?1:-1); ball.dy=-ball.speed; } movePaddleTo(lastTouchX); isDragging=true; });
canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); if(!isDragging) return; const rect=canvas.getBoundingClientRect(); const touch=e.touches[0]; lastTouchX=touch.clientX-rect.left; movePaddleTo(lastTouchX); });
canvas.addEventListener('touchend', ()=>{ isDragging=false; });

// --- Запуск ---
updateHighScoreUI();
loop();

restartBtn.addEventListener('click', ()=>{ resetGame(); loop(); });
</script>

</body>
</html>
