<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Шарик: левая и правая стороны одинаковые, без пролётов</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .ball {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
      transform: translate(-50%, -50%);
      z-index: 5;
    }
    .paddle {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 120px;
      height: 12px;
      margin-left: -60px;
      background: #333;
      border-radius: 6px;
      /* Оранжевая рамка — границы платформы */
      border: 2px solid #ffaa00;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .edge-marker {
      position: absolute;
      width: 4px;
      height: 16px;
      background: #ff3333;
      z-index: 6;
      bottom: 8px;
    }
    .left-edge { left: -2px; }
    .right-edge { right: -2px; }

    .target {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8), 0 0 4px rgba(100,100,100,0.3);
      transform: translate(-50%, -50%);
      z-index: 4;
    }
    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      z-index: 10;
    }
    #progress-container {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 240px;
      height: 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      z-index: 10;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      border-radius: 6px;
      transition: width 0.2s ease;
    }
    #progress-text {
      position: absolute;
      top: 38px;
      right: 20px;
      font-size: 14px;
      color: #aaa;
      z-index: 10;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #restart-btn {
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
      background: #fff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
    }
    h1, p { margin: 0 0 16px; }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">Счёт: 0</div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">0 / 4 рядов</div>

    <div class="paddle" id="paddle">
      <div class="edge-marker left-edge" id="left-edge"></div>
      <div class="edge-marker right-edge" id="right-edge"></div>
    </div>
    <div class="ball" id="ball"></div>
  </div>

  <div id="overlay" style="display:none;">
    <h1>Игра окончена</h1>
    <p>Ваш рейтинг (счёт): <span id="final-score">0</span></p>
    <button id="restart-btn">Играть снова</button>
  </div>

  <script>
    const game = document.getElementById('game');
    const ball = document.getElementById('ball');
    const paddle = document.getElementById('paddle');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const leftEdge = document.getElementById('left-edge');
    const rightEdge = document.getElementById('right-edge');

    let ballX, ballY, ballVx, ballVy;
    let paddleLeft;
    const paddleSpeed = 7;
    let ballSpeed = 5;
    let score = 0;
    let targets = [];
    let animationId;
    let isGameRunning = false;

    window.keys = {};
    window.addEventListener('keydown', e => { window.keys[e.key] = true; });
    window.addEventListener('keyup', e => { window.keys[e.key] = false; });

    const rows = 4;
    const size = 24;
    const gap = 2;
    const startY = 60;

    function createTargets() {
      targets = [];
      const countPerRow = Math.floor(game.clientWidth / (size + gap));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < countPerRow; c++) {
          const el = document.createElement('div');
          el.className = 'target';
          const x = (c * (size + gap)) + (size / 2);
          const y = startY + (r * (size + gap));
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          game.appendChild(el);
          targets.push({ el, x, y, w: size, h: size, active: true, row: r });
        }
      }
      updateProgress(0);
    }

    function updateProgress(destroyedRows) {
      const percent = Math.round((destroyedRows / rows) * 100);
      progressBar.style.width = percent + '%';
      progressText.textContent = destroyedRows + ' / ' + rows + ' рядов';
    }

    function resetGame() {
      document.querySelectorAll('.target').forEach(el => el.remove());
      targets = [];
      score = 0;
      ballSpeed = 5;
      scoreEl.textContent = 'Счёт: 0';
      overlay.style.display = 'none';
      createTargets();

      ballX = game.clientWidth / 2;
      ballY = game.clientHeight / 2;
      ballVx = ballSpeed;
      ballVy = ballSpeed;

      paddleLeft = parseFloat(getComputedStyle(paddle).left);
      if (isNaN(paddleLeft)) paddleLeft = game.clientWidth / 2 - 60;

      isGameRunning = true;
      animate();
    }

    // Проверка пересечения отрезка с прямоугольником
    function segmentRectIntersect(x1, y1, x2, y2, rx, ry, rw, rh) {
      const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);

      if (maxX < rx || minX > rx + rw || maxY < ry || minY > ry + rh) return false;

      const inside1 = (x1 >= rx && x1 <= rx + rw && y1 >= ry && y1 <= ry + rh);
      const inside2 = (x2 >= rx && x2 <= rx + rw && y2 >= ry && y2 <= ry + rh);
      return inside1 || inside2;
    }

    function getPaddleBounds() {
      const w = 120;
      const h = 12;
      const right = paddleLeft + w;
      const top = game.clientHeight - 20 - h;
      const bottom = top + h;
      return { left: paddleLeft, right, top, bottom, w, h };
    }

    function applyBounce(p) {
      // Угол отскока зависит от позиции относительно центра
      const center = p.left + p.w / 2;
      const distFromCenter = (ballX - center) / (p.w / 2); // от -1 до 1
      const maxAngle = Math.PI / 3;
      const angle = distFromCenter * maxAngle;

      ballVx = ballSpeed * Math.sin(angle);
      ballVy = -ballSpeed * Math.abs(Math.cos(angle));
    }

    function animate() {
      if (!isGameRunning) return;

      const prevBallX = ballX;
      const prevBallY = ballY;

      // Движение платформы
      if (window.keys['ArrowLeft'] || window.keys['a']) paddleLeft -= paddleSpeed;
      if (window.keys['ArrowRight'] || window.keys['d']) paddleLeft += paddleSpeed;
      const minLeft = 0;
      const maxLeft = game.clientWidth - 120;
      if (paddleLeft < minLeft) paddleLeft = minLeft;
      if (paddleLeft > maxLeft) paddleLeft = maxLeft;
      paddle.style.left = paddleLeft + 'px';
      leftEdge.style.left = '-2px';
      rightEdge.style.right = '-2px';

      // Движение шарика
      ballX += ballVx;
      ballY += ballVy;

      // Стены
      if (ballX <= 10 || ballX >= game.clientWidth - 10) ballVx *= -1;
      if (ballY <= 10) ballVy *= -1;

      // Проигрыш
      if (ballY >= game.clientHeight + 10) {
        isGameRunning = false;
        finalScore.textContent = score;
        overlay.style.display = 'flex';
        return;
      }

      const p = getPaddleBounds();

      let didBounce = false;

      // 1. Сначала — проверка траектории (ловит проскоки слева и справа одинаково)
      if (segmentRectIntersect(prevBallX, prevBallY, ballX, ballY, p.left, p.top, p.w, p.h)) {
        // Выталкиваем ровно над платформой
        ballY = p.top - 10;
        applyBounce(p);
        didBounce = true;
      }
      // 2. Если не сработало по траектории — проверяем, не оказался ли шарик внутри платформы
      else if (
        ballY >= p.top && ballY <= p.bottom &&
        ballX >= p.left - 10 && ballX <= p.right + 10
      ) {
        ballY = p.top - 10;
        applyBounce(p);
        didBounce = true;
      }
      // 3. AABB сверху (резервный, если предыдущие не сработали)
      else if (
        ballY - 10 <= p.top &&
        ballY + 10 >= p.top &&
        ballX - 10 <= p.right &&
        ballX + 10 >= p.left
      ) {
        ballY = p.top - 10;
        applyBounce(p);
        didBounce = true;
      }

      // Цели
      for (const t of targets) {
        if (!t.active) continue;
        const dx = ballX - t.x;
        const dy = ballY - t.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < 22) {
          t.active = false;
          t.el.style.opacity = '0';
          t.el.style.pointerEvents = 'none';
          score += 10;
          scoreEl.textContent = 'Счёт: ' + score;
          if (Math.random() > 0.5) ballVx *= -1; else ballVy *= -1;
        }
      }

      // Подсчёт рядов
      const activeRows = new Set();
      for (const t of targets) if (t.active) activeRows.add(t.row);
      const destroyedRowsCount = rows - activeRows.size;
      updateProgress(destroyedRowsCount);

      // Ускорение
      if (destroyedRowsCount > 0) {
        const speedBoost = 1 + (destroyedRowsCount * 0.15);
        const currentSpeed = Math.sqrt(ballVx*ballVx + ballVy*ballVy);
        const newSpeed = currentSpeed * speedBoost;
        const norm = Math.sqrt(ballVx*ballVx + ballVy*ballVy);
        if (norm > 0) {
          ballVx = (ballVx / norm) * newSpeed;
          ballVy = (ballVy / norm) * newSpeed;
        }
      }

      ball.style.left = ballX + 'px';
      ball.style.top = ballY + 'px';

      animationId = requestAnimationFrame(animate);
    }

    restartBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>

</html>
