<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Арканоид: Вертикальный</title>
    
    <!-- Правильный viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Минимум на высоту экрана */
            overflow: hidden;
            touch-action: none;
        }
        
        /* Главный контейнер для центрирования игры с учетом выемок телефона */
        .game-wrapper {
            width: 100%;
            height: 100dvh; /* Используем Dynamic Viewport Height */
            position: relative;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #000;
            border: 4px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 3 / 5; /* Строго вертикальное поле */
        }

        /* UI адаптировано под узкий экран */
        #uiContainer {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0) + 15px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            pointer-events: none;
            flex-direction: column;
            align-items: center;
        }
        #scoreBoard, #highScoreBoard {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            min-width: 140px;
        }

        #gameOverOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 30px 20px 120px;
            box-sizing: border-box;
        }
        #finalScoreText {
            font-size: 28px;
            color: #ccc;
            margin-bottom: 10px;
        }
        #leaderboardBox {
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            width: 90%;
            max-height: 50vh;
            overflow-y: auto;
        }
        #leaderboardTitle {
            font-size: 26px;
            margin-bottom: 15px;
            color: #FFD700;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 22px;
            border-bottom: 1px dashed #444;
        }
        .lb-rank { font-weight: bold; color: #aaa; min-width: 40px; }
        .lb-score { font-weight: bold; }

        #restartBtn {
            padding: 18px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
            transform: scale(1);
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0) + 20px);
        }
        #restartBtn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        #touchHint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0) + 90px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            color: #FFD700;
            border: 1px solid #FFD700;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>
</div>

<div id="uiContainer">
    <div id="scoreBoard">Счет: 0</div>
    <div id="highScoreBoard">Рекорд: --</div>
</div>

<div id="touchHint">Водите пальцем →</div>

<div id="gameOverOverlay">
    <h1 style="font-size: 52px; margin: 0;">Конец</h1>
    <div id="finalScoreText"></div>
    
    <div id="leaderboardBox">
        <div id="leaderboardTitle">ТОП РЕЗУЛЬТАТЫ</div>
        <div id="leaderboardList"></div>
    </div>
    
    <button id="restartBtn">Заново</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');
const highScoreBoard = document.getElementById('highScoreBoard');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreText = document.getElementById('finalScoreText');
const restartBtn = document.getElementById('restartBtn');
const leaderboardList = document.getElementById('leaderboardList');
const touchHint = document.getElementById('touchHint');

// --- Идеальная подгонка под размер экрана ---
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const wrapper = document.querySelector('.game-wrapper').getBoundingClientRect();
    
    // Берем меньшую сторону как эталон, чтобы влезть точно
    let targetWidth = Math.min(wrapper.width, wrapper.height * 0.6); 
    let targetHeight = targetWidth * (5/3);
