<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Арканоид: Mobile</title>
    
    <!-- Оптимизация для мобильного браузера -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Отключаем стандартные скроллы и зумы при касании canvas */
        }
        
        canvas {
            background-color: #000;
            border: 4px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 8 / 5; /* Сохраняем пропорции холста */
        }

        /* Адаптивный UI */
        #uiContainer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            pointer-events: none; /* Пропускаем клики сквозь UI */
        }
        #scoreBoard, #highScoreBoard {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            min-width: 140px;
        }

        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 25px;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #finalScoreText {
            font-size: 28px;
            color: #ccc;
            margin-bottom: 10px;
        }
        #leaderboardBox {
            background: rgba(20, 20, 20, 0.85);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            max-width: 90%;
        }
        #leaderboardTitle {
            font-size: 26px;
            margin-bottom: 15px;
            color: #FFD700;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 22px;
            border-bottom: 1px dashed #444;
        }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank { font-weight: bold; color: #aaa; min-width: 40px; }
        .lb-score { font-weight: bold; }

        /* Большая кнопка для пальца */
        #restartBtn {
            padding: 25px 50px;
            font-size: 24px;
            background: linear-gradient(45deg, #FFD700, #FFC107);
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
            transform: scale(1);
        }
        #restartBtn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.5);
        }
        #restartBtn:active:not(:disabled) {
            transform: scale(0.98);
        }
        #restartBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Подсказка по управлению */
        #touchHint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: #FFD700;
            border: 1px solid #FFD700;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<div id="uiContainer">
    <div id="scoreBoard">Счет: 0</div>
    <div id="highScoreBoard">Рекорд: --</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="touchHint">Водите пальцем по экрану</div>

<div id="gameOverOverlay">
    <h1 style="font-size: 52px; margin: 0;">Игра окончена</h1>
    <div id="finalScoreText"></div>
    
    <div id="leaderboardBox">
        <div id="leaderboardTitle">Лучшие броски:</div>
        <div id="leaderboardList"></div>
    </div>
    
    <button id="restartBtn">Заново</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
// Устанавливаем размер холста точно под видимую область браузера (без адресной строки)
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const vw = Math.min(window.innerWidth, 800); // Ограничиваем ширину для очень широких планшетов
    const vh = window.innerHeight;
    
    canvas.width = vw * dpr;
    canvas.height = vh * dpr;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');
const highScoreBoard = document.getElementById('highScoreBoard');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreText = document.getElementById('finalScoreText');
const restartBtn = document.getElementById('restartBtn');
const leaderboardList = document.getElementById('leaderboardList');
const touchHint = document.getElementById('touchHint');

// --- Объекты (адаптация размеров под высоту экрана) ---
let basePaddleWidth = 180;
if (canvas.width < 500) basePaddleWidth = 140;

const paddle = {
    x: canvas.width / 2 - basePaddleWidth / 2,
    y: canvas.height - 60,
    width: basePaddleWidth,
    height: 20,
    speed: canvas.width * 0.015, // Скорость зависит от ширины экрана
    targetX: canvas.width / 2 - basePaddleWidth / 2 // Для плавного следования
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height - 80,
    radius: 12,
    dx: 0,
    dy: 0,
    speed: 6
};

let targets = [];
const targetRadius = 18;
const rowsCount = 6;
let colsCount = 0;

let score = 0;
let isGameOver = false;
let animationFrameId = null;
let isDragging = false;

// --- Рекорды ---
function loadHighScores() {
    return JSON.parse(localStorage.getItem('arkanoidMobileScores') || '[0,0,0,0,0]');
}
function saveHighScores(scores) {
    localStorage.setItem('arkanoidMobileScores', JSON.stringify(scores));
}
function updateHighScoreUI() {
    const scores = loadHighScores();
    highScoreBoard.innerHTML = `Рекорд: ${scores[0] || '--'}`;
}
function checkNewHighScore(currentScore) {
    let scores = loadHighScores();
    if (currentScore > scores[scores.length - 1]) {
        scores.push(currentScore);
        scores.sort((a, b) => b - a);
        scores.splice(5);
        saveHighScores(scores);
        updateHighScoreUI();
    }
}
function renderLeaderboard() {
    const scores = loadHighScores();
    leaderboardList.innerHTML = '';
    scores.forEach((s, index) => {
        if (s === 0 && index > 0) return;
        const item = document.createElement('div');
        item.className = 'lb-item';
        let rankText = '';
        switch(index + 1) {
            case 1: rankText = '🥇'; break;
            case 2: rankText = '🥈'; break;
            case 3: rankText = '🥉'; break;
            default: rankText = `${index + 1}.`; break;
        }
        item.innerHTML = `<span class="lb-rank">${rankText}</span><span class="lb-score">${s} очков</span>`;
        leaderboardList.appendChild(item);
    });
}

// --- Создание целей (автоматическая сетка) ---
function createTargets() {
    targets = [];
    const horizontalSpacePerBall = targetRadius * 2 + 30; 
    colsCount = Math.floor(canvas.width / horizontalSpacePerBall);
    const totalGridWidth = colsCount * horizontalSpacePerBall - 30;
    const startX = (canvas.width - totalGridWidth) / 2 + targetRadius;
    const startY = 80;
    const verticalStep = targetRadius * 2 + 30;

    for (let r = 0; r < rowsCount; r++) {
        for (let c = 0; c < colsCount; c++) {
            const x = startX + c * horizontalSpacePerBall;
            const y = startY + r * verticalStep;
            const hue = 55 - r * 8; 
            targets.push({ x, y, radius: targetRadius, status: 1, color: `hsl(${hue}, 90%, 55%)` });
        }
    }
}

// --- Отрисовка ---
function drawPaddle() {
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 10);
    ctx.fillStyle = '#FFF';
    ctx.fill();
    ctx.closePath();
    
    // Полупрозрачный след для удобства на мобильном
    ctx.beginPath();
    ctx.roundRect(paddle.targetX, paddle.y, paddle.width, paddle.height, 10);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fill();
    ctx.closePath();
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF';
    ctx.fill();
    ctx.closePath();
}

function drawTargets() {
    targets.forEach(target => {
        if (target.status === 1) {
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = target.color;
            ctx.shadowColor = target.color;
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }
    });
}

// --- Игровая логика ---
function movePaddleTo(x) {
    if (isGameOver) return;
    paddle.targetX = Math.max(0, Math.min(x - paddle.width / 2, canvas.width - paddle.width));
}

// Плавное движение ракетки к цели (Lerp)
function updatePaddlePosition() {
    const diff = paddle.targetX - paddle.x;
    paddle.x += diff * 0.2; 
}

function circleCollision(circleX, circleY, circleR, targetX, targetY, targetR) {
    const distanceSq = (circleX - targetX)**2 + (circleY - targetY)**2;
    const radiiSum = circleR + targetR;
    return distanceSq < radiiSum * radiiSum;
}

function resolveWallCollisions() {
    if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
        ball.dx = -ball.dx;
    }
    if (ball.y + ball.dy < ball.radius) {
        ball.dy = -ball.dy;
    }
}

function collisionDetection() {
    resolveWallCollisions();

    // Ракетка
    if (ball.y + ball.dy > canvas.height - ball.radius - paddle.height) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
            let hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            ball.dx = hitPos * 7;
            ball.dy = -Math.abs(ball.dy) * 1.05; // Ускорение мяча вверх
            if (Math.abs(ball.dx) > 9) ball.dx = ball.dx > 0 ? 9 : -9;
        }
    }

    // Проигрыш
    if (ball.y - ball.radius > canvas.height) {
        endGame();
        return;
    }

    // Цели
    targets.forEach(target => {
        if (target.status === 1 && circleCollision(ball.x, ball.y, ball.radius, target.x, target.y, target.radius)) {
            target.status = 0;
            const absDX = Math.abs(ball.x - target.x);
            const absDY = Math.abs(ball.y - target.y);
            if (absDX > absDY) {
                ball.dx = -ball.dx;
            } else {
                ball.dy = -ball.dy;
            }
            score += 10;
            scoreBoard.innerHTML = 'Счет: ' + score;
        }
    });

    // Победа
    if (targets.every(t => t.status === 0)) {
        alert('ПОБЕДА! Вы очистили поле!');
        resetGame();
    }
}

function endGame() {
    cancelAnimationFrame(animationFrameId);
    isGameOver = true;
    checkNewHighScore(score);
    finalScoreText.innerHTML = `Вы набрали: ${score} очков`;
    renderLeaderboard();
    gameOverOverlay.style.display = 'flex';
    touchHint.style.display = 'none';
}

function resetGame() {
    score = 0;
    isGameOver = false;
    scoreBoard.innerHTML = 'Счет: 0';
    
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 80;
    // Запускаем мяч только после первого тапа
    ball.dx = 0; 
    ball.dy = 0;
    
    paddle.x = canvas.width / 2 - paddle.width / 2;
    paddle.targetX = paddle.x;
    
    createTargets();
    gameOverOverlay.style.display = 'none';
    touchHint.style.display = 'block';
}

// --- Главный цикл ---
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    updatePaddlePosition();
    
    drawTargets();
    drawBall();
    drawPaddle();
    
    if (!isGameOver) {
        collisionDetection();
        if (ball.dx !== 0 || ball.dy !== 0) {
            ball.x += ball.dx;
            ball.y += ball.dy;
        }
        animationFrameId = requestAnimationFrame(loop);
    }
}

// --- Управление (Touch Events) ---
let lastTouchX = 0;

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    lastTouchX = touch.clientX - rect.left;
    
    // Если игра ждет старта (мяч лежит на ракетке)
    if (!isGameOver && ball.dx === 0 && ball.dy === 0) {
        ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -ball.speed;
    }
    
    movePaddleTo(lastTouchX);
    isDragging = true;
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    lastTouchX = touch.clientX - rect.left;
    movePaddleTo(lastTouchX);
});

canvas.addEventListener('touchend', () => {
    isDragging = false;
});

// На всякий случай поддержка мыши для десктопа
canvas.addEventListener('mousemove', (e) => {
    if (isGameOver) return;
    const rect = canvas.getBoundingClientRect();
    movePaddleTo(e.clientX - rect.left);
});

// --- Инициализация ---
createTargets();
updateHighScoreUI();
loop();

restartBtn.addEventListener('click', () => {
    resetGame();
    loop();
});
</script>

</body>
</html>
