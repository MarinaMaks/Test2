<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Игра Шарик</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .ball {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
    }
    .paddle {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 120px;
      height: 12px;
      margin-left: -60px;
      background: #ccc;
      border-radius: 6px;
    }
    .target {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #666;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(100,100,100,0.6);
    }
    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      z-index: 10;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #start-btn, #restart-btn {
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
      background: #fff;
      border: none;
      border-radius: 8px;
      color: #000;
    }
    h1, p { margin: 0 0 16px; }
  </style>
</head>
<body>
  <div id="game">
    <div id="score">Счёт: 0</div>
    <div class="paddle" id="paddle"></div>
    <div class="ball" id="ball"></div>

    <!-- Целевые шарики будут добавлены через JS -->
  </div>

  <div id="overlay" style="display:none;">
    <h1>Игра окончена</h1>
    <p>Ваш рейтинг (счёт): <span id="final-score">0</span></p>
    <button id="restart-btn">Играть снова</button>
  </div>

  <script>
    const game = document.getElementById('game');
    const ball = document.getElementById('ball');
    const paddle = document.getElementById('paddle');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    let ballX, ballY, ballVx, ballVy;
    let paddleX;
    const paddleSpeed = 10;
    const ballSpeed = 5;
    let score = 0;
    let targets = [];
    let animationId;
    let isGameRunning = false;

    function createTargets() {
      targets = [];
      const rows = 4;
      const cols = 8;
      const size = 24;
      const gap = 8;
      const totalWidth = cols * (size + gap) - gap;
      const startX = (game.clientWidth - totalWidth) / 2;
      const startY = 60;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement('div');
          el.className = 'target';
          el.style.left = (startX + c * (size + gap)) + 'px';
          el.style.top = (startY + r * (size + gap)) + 'px';
          game.appendChild(el);
          targets.push({ el, x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: size, h: size, active: true });
        }
      }
    }

    function resetGame() {
      // Удаляем старые цели
      document.querySelectorAll('.target').forEach(el => el.remove());
      targets = [];
      score = 0;
      scoreEl.textContent = 'Счёт: 0';
      overlay.style.display = 'none';

      createTargets();

      const halfBall = 10; // половина ширины/высоты шарика
      ballX = game.clientWidth / 2;
      ballY = game.clientHeight / 2;
      ballVx = ballSpeed;
      ballVy = ballSpeed;

      paddleX = game.clientWidth / 2;
      paddle.style.left = (paddleX - 60) + 'px';

      isGameRunning = true;
      animate();
    }

    function animate() {
      if (!isGameRunning) return;

      // Движение шарика
      ballX += ballVx;
      ballY += ballVy;

      // Отскок от стен
      if (ballX <= 10 || ballX >= game.clientWidth - 10) {
        ballVx *= -1;
      }
      if (ballY <= 10) {
        ballVy *= -1;
      }

      // Падение — проигрыш
      if (ballY >= game.clientHeight + 10) {
        isGameRunning = false;
        finalScore.textContent = score;
        overlay.style.display = 'flex';
        return;
      }

      // Столкновение с платформой
      const paddleW = 120;
      const paddleH = 12;
      if (
        ballY + 10 >= game.clientHeight - 20 - paddleH &&
        ballX >= paddleX - paddleW/2 &&
        ballX <= paddleX + paddleW/2
      ) {
        // Угол отскока зависит от позиции удара по платформе
        const distFromCenter = (ballX - paddleX) / (paddleW / 2);
        const maxAngle = Math.PI / 3; // 60 градусов
        const angle = distFromCenter * maxAngle;
        const speed = ballSpeed;
        ballVx = speed * Math.sin(angle);
        ballVy = -speed * Math.abs(Math.cos(angle));
      }

      // Столкновения с целями
      for (const t of targets) {
        if (!t.active) continue;
        const dx = ballX - t.x;
        const dy = ballY - t.y;
        const distance = Math.sqrt(dx*dx + dy*dy);
        if (distance < 22) { // 10 (радиус шара) + 12 (радиус цели) ≈ 22
          t.active = false;
          t.el.style.opacity = '0';
          t.el.style.pointerEvents = 'none';
          score += 10;
          scoreEl.textContent = 'Счёт: ' + score;

          // Небольшой рандомный разброс скорости
          if (Math.random() > 0.5) ballVx *= -1; else ballVy *= -1;
        }
      }

      // Позиционирование шарика
      ball.style.left = ballX + 'px';
      ball.style.top = ballY + 'px';

      animationId = requestAnimationFrame(animate);
    }

    // Управление платформой
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
    });
    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    setInterval(() => {
      if (!isGameRunning) return;
      if (keys['ArrowLeft'] || keys['a']) {
        paddleX -= paddleSpeed;
      }
      if (keys['ArrowRight'] || keys['d']) {
        paddleX += paddleSpeed;
      }
      // Ограничение по краям
      if (paddleX < 60) paddleX = 60;
      if (paddleX > game.clientWidth - 60) paddleX = game.clientWidth - 60;
      paddle.style.left = (paddleX - 60) + 'px';
    }, 16);

    restartBtn.addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
